name: Update v2fly-ads rules

on:
  schedule:
    # 每天 UTC 20:00 运行 (北京时间次日 04:00)
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

# 允许工作流向仓库写入 (提交更新后的规则文件)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 生成规则文件
        run: python3 scripts/generate_rules3.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules3/v2fly-ads.list rules3/v2fly-ads.json
          git commit -m "chore: 自动更新 v2fly-ads 规则 ($(date -u +'%Y-%m-%d %H:%M UTC'))" --allow-empty
          git push
