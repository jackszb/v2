name: Update apple-cn / apple-!cn rules

on:
  schedule:
    # 每周一 UTC 20:00 运行 (北京时间周二 04:00)
    - cron: "0 20 * * 1"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

# 允许工作流向仓库写入 (提交更新后的规则文件)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 生成规则文件
        run: python3 scripts/generate_rules4.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "rules4/apple-cn.list" "rules4/apple-cn.json" "rules4/apple-!cn.list" "rules4/apple-!cn.json"
          git commit -m "chore: 自动更新 apple-cn / apple-!cn 规则 ($(date -u +'%Y-%m-%d %H:%M UTC'))" --allow-empty
          git push
