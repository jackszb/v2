name: Update v2fly-cn rules

on:
  schedule:
    # 每天 UTC 20:00 运行 (北京时间次日 04:00)
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发

# 允许工作流向仓库写入 (提交更新后的规则文件)
permissions:
  contents: write

# 防止同一个工作流并发运行时互相冲突导致 push 被拒绝
concurrency:
  group: update-v2fly-cn-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 生成规则文件
        run: python3 scripts/generate_rules.py

      - name: 提交并推送变更
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/v2fly-cn.list rules/v2fly-cn.json
          git commit -m "chore: 自动更新 v2fly-cn 规则 ($(date -u +'%Y-%m-%d %H:%M UTC'))" --allow-empty

          # push 前先同步远程最新提交，避免因非快进(non-fast-forward)被拒绝
          # 失败时重试几次，每次间隔随机几秒，降低并发冲突概率
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败，第 $i 次重试..."
            sleep $((RANDOM % 10 + 1))
          done

          echo "多次重试后仍推送失败"
          exit 1
