#youtube
AND,((DOMAIN-SUFFIX,googlevideo.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com), (PROTOCOL,UDP)),REJECT
#myself
RULE-SET,https://raw.githubusercontent.com/jackszb/v2/main/rules3/v2fly-ads.list,REJECT
RULE-SET,https://raw.githubusercontent.com/jackszb/v2/main/rules4/apple-cn.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/jackszb/v2/main/rules/v2fly-cn.list,DIRECT
